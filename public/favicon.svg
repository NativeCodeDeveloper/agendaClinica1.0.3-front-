<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<style>
.fav-light{display:inline}
.fav-dark{display:none}
@media (prefers-color-scheme: dark){
.fav-light{display:none}
.fav-dark{display:inline}
}
</style>
<image class="fav-light" href="data:image/png;base64," width="128" height="128"/>
<image class="fav-dark" href="data:image/png;base64," width="128" height="128"/>
</svg>
